x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  env_file: .env
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    # Airflow 3.x uses API server instead of webserver
    AIRFLOW__API__PORT: 8086
    AIRFLOW__API__BASE_URL: http://localhost:8086
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://localhost:8086/execution/
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    # JWT signing secret for the internal worker→api-server token (must match
    # across all airflow containers). Keep this OUT of the compose literal —
    # it lives in .env so it isn't committed and can come from a secret store.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    # KeycloakAuthManager replaces the default SimpleAuthManager (random
    # per-restart admin password, no real RBAC). Realm "lakehouse" lives in
    # the keycloak service (http://localhost:8087); same realm federates
    # Unity Catalog so a single user logs into both.
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.keycloak.auth_manager.keycloak_auth_manager.KeycloakAuthManager
    AIRFLOW__KEYCLOAK_AUTH_MANAGER__SERVER_URL: http://localhost:8087
    AIRFLOW__KEYCLOAK_AUTH_MANAGER__REALM: lakehouse
    AIRFLOW__KEYCLOAK_AUTH_MANAGER__CLIENT_ID: airflow
    AIRFLOW__KEYCLOAK_AUTH_MANAGER__CLIENT_SECRET: ${AIRFLOW_KEYCLOAK_CLIENT_SECRET}
    # OpenLineage — emit task lineage events to Marquez so SDP-via-Airflow
    # runs show up in the lineage graph alongside Spark-side jobs.
    AIRFLOW__OPENLINEAGE__TRANSPORT: '{"type":"http","url":"http://localhost:5001","endpoint":"/api/v1/lineage"}'
    AIRFLOW__OPENLINEAGE__NAMESPACE: lakehouse
    AIRFLOW__OPENLINEAGE__DISABLED: 'False'
    # Point the spark-pipelines CLI at the long-running Connect daemon in
    # spark-connect-41 (host network, port 15002). The Airflow worker stays
    # thin: it only sends Connect RPCs, the Connect server runs the pipeline.
    SPARK_REMOTE: 'sc://localhost:15002'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Spark connection settings
    SPARK_MASTER_40: spark://localhost:7077
    SPARK_MASTER_41: spark://localhost:7078
    # Kafka settings
    KAFKA_BOOTSTRAP_SERVERS: localhost:9092
    # S3/SeaweedFS settings (inherited from .env)
    AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
    AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    AWS_ENDPOINT_URL: ${S3_ENDPOINT}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs/airflow:/opt/airflow/logs
    - ./config/airflow:/opt/airflow/config
    - ./scripts:/opt/airflow/scripts
    - ./jars:/opt/airflow/jars
    - ./data:/opt/airflow/data
  network_mode: "host"
  depends_on:
    airflow-init:
      condition: service_completed_successfully

services:
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        # Create Airflow database if it doesn't exist
        PGPASSWORD=${POSTGRES_PASSWORD} psql -h localhost -U ${POSTGRES_USER} -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'airflow'" | grep -q 1 || \
        PGPASSWORD=${POSTGRES_PASSWORD} psql -h localhost -U ${POSTGRES_USER} -d postgres -c "CREATE DATABASE airflow"

        # Initialize Airflow database
        airflow db migrate

        # Create admin user if it doesn't exist
        airflow users list | grep -q "${AIRFLOW_ADMIN_USER:-admin}" || \
        airflow users create \
          --username ${AIRFLOW_ADMIN_USER:-admin} \
          --password ${AIRFLOW_ADMIN_PASSWORD:-admin} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@localhost

        echo "Airflow initialization complete"
    environment:
      <<: *airflow-common-env
    depends_on: []
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: api-server
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8086/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow-triggerer
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
