# Keycloak — single source of truth for identity across the lakehouse stack.
#
# Federates Airflow (KeycloakAuthManager) and Unity Catalog OSS
# (server.authorization=enable). Same user logs into both with one set of
# credentials; each service still enforces its own permissions (Airflow
# DAG ACLs, UC table ACLs).
#
# Realm: "lakehouse" (imported from config/keycloak/realm-lakehouse.json on
# first boot). Clients: "airflow", "unity-catalog". Demo user:
# lakehouse-admin / lakehouse (override via .env).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose-keycloak.yml up -d keycloak
#
# UI:    http://localhost:8087/admin   (admin / admin from .env)
# Realm: http://localhost:8087/realms/lakehouse/.well-known/openid-configuration

services:
  keycloak-init:
    image: postgres:16-alpine
    container_name: keycloak-init
    network_mode: "host"
    env_file: .env
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        echo "Ensuring keycloak database exists..."
        PGPASSWORD=$${POSTGRES_PASSWORD} psql -h localhost -U $${POSTGRES_USER} -d postgres \
          -tc "SELECT 1 FROM pg_database WHERE datname = '$${KEYCLOAK_DB_NAME}'" | grep -q 1 || \
        PGPASSWORD=$${POSTGRES_PASSWORD} psql -h localhost -U $${POSTGRES_USER} -d postgres \
          -c "CREATE DATABASE $${KEYCLOAK_DB_NAME}"
        echo "Done."

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: keycloak
    network_mode: "host"
    env_file: .env
    environment:
      # Admin console credentials
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Database — reuses the host's Postgres (separate DB)
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://localhost:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # HTTP (no TLS for the demo) — port 8087 because 8080-8086 are taken
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8087
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME: http://localhost:8087
      KC_PROXY_HEADERS: xforwarded
      # Logging
      KC_LOG_LEVEL: INFO
    volumes:
      - ./config/keycloak:/opt/keycloak/data/import:ro
    command: ["start-dev", "--import-realm"]
    depends_on:
      keycloak-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8087 && echo -e 'GET /realms/master HTTP/1.0\\n\\n' >&3 && head -1 <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    restart: unless-stopped
